<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jaren 90 Quiz</title>
  <link rel="stylesheet" href="css/quiz.css" />
</head>
<body>
  <!-- Startscherm -->
  <div id="screen-start" class="screen active">
    <div class="container">
      <div class="title-box">
        <h1>&#127926; Jaren 90 Quiz &#127926;</h1>
        <p class="subtitle">Voor 2 spelers &bull; 20 vragen</p>
      </div>
      <div class="player-setup">
        <div class="player-input">
          <label for="player1-name">&#127919; Speler 1</label>
          <input type="text" id="player1-name" placeholder="Naam speler 1" maxlength="20" />
        </div>
        <div class="vs-badge">VS</div>
        <div class="player-input">
          <label for="player2-name">&#127919; Speler 2</label>
          <input type="text" id="player2-name" placeholder="Naam speler 2" maxlength="20" />
        </div>
      </div>
      <button id="btn-start" class="btn btn-primary">START DE QUIZ!</button>
    </div>
  </div>

  <!-- Quizscherm -->
  <div id="screen-quiz" class="screen">
    <div class="container">
      <div class="quiz-header">
        <div class="player-score" id="score-p1">
          <span class="player-label" id="label-p1">Speler 1</span>
          <span class="score-value" id="points-p1">0</span>
        </div>
        <div class="progress-info">
          <div class="question-counter" id="question-counter">Vraag 1 / 20</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
        </div>
        <div class="player-score" id="score-p2">
          <span class="player-label" id="label-p2">Speler 2</span>
          <span class="score-value" id="points-p2">0</span>
        </div>
      </div>

      <div class="turn-banner" id="turn-banner">Speler 1 is aan de beurt!</div>

      <div class="question-box">
        <div class="category-tag" id="category-tag">Muziek</div>
        <p class="question-text" id="question-text">Vraag komt hier...</p>
      </div>

      <div class="answers-grid" id="answers-grid">
        <!-- antwoorden worden dynamisch toegevoegd -->
      </div>

      <div class="feedback-overlay" id="feedback-overlay">
        <div class="feedback-box" id="feedback-box">
          <div class="feedback-icon" id="feedback-icon"></div>
          <div class="feedback-text" id="feedback-text"></div>
          <div class="feedback-correct" id="feedback-correct"></div>
          <button class="btn btn-next" id="btn-next">Volgende vraag &#9658;</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Eindscherm -->
  <div id="screen-end" class="screen">
    <div class="container">
      <div class="end-trophy" id="end-trophy">&#127942;</div>
      <h2 class="end-title" id="end-title">Gefeliciteerd!</h2>
      <p class="end-winner" id="end-winner"></p>
      <div class="final-scores">
        <div class="final-score-card" id="final-p1">
          <span class="final-name" id="final-name-p1">Speler 1</span>
          <span class="final-pts" id="final-pts-p1">0 punten</span>
        </div>
        <div class="final-score-card" id="final-p2">
          <span class="final-name" id="final-name-p2">Speler 2</span>
          <span class="final-pts" id="final-pts-p2">0 punten</span>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-restart">Opnieuw spelen!</button>
    </div>
  </div>

  <script src="js/quiz.js"></script>
</body>
</html>
